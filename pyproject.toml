[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doublebind"
version = "0.0.1"
description = "DoubleBind: predict resistance evolution and collateral-sensitivity drug pairs (research prototype)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
full = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14", "biopython>=1.83"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
